<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">TMA and MMA barriers coordinating a shared-memory tile</title>
  <desc id="desc">A small phase-tracking overview sits above two pictorial flows. First, TMA copies highlighted tiles from global matrices A and B into shared memory while CTA threads wait at the TMA barrier. Second, MMA consumes those shared tiles and accumulates into a matrix C tile in tensor memory while the threads wait at the MMA barrier before reusing shared memory.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26304f" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6476df"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#31929e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d76543"/>
    </marker>
    <g id="thread">
      <circle cx="8" cy="6" r="5.5" fill="#6476df"/>
      <rect x="1" y="13" width="14" height="11" rx="5" fill="#cbd2f2" stroke="#6476df"/>
    </g>
    <g id="matrix-grid">
      <rect width="80" height="70" rx="7" fill="#ffffff" stroke="#cfd6e5" stroke-width="1.5"/>
      <path d="M20 0V70M40 0V70M60 0V70M0 17.5H80M0 35H80M0 52.5H80" fill="none" stroke="#dce1ea"/>
    </g>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .section-label { font-size: 11px; font-weight: 780; letter-spacing: 0.9px; }
      .panel-title { fill: #172033; font-size: 18px; font-weight: 750; }
      .body { fill: #667085; font-size: 13px; font-weight: 520; }
      .small { fill: #7a8496; font-size: 11px; font-weight: 540; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#fbfcff"/>

  <g class="sans">
    <text x="600" y="38" text-anchor="middle" fill="#172033" font-size="25" font-weight="750">How the two barriers protect one shared-memory stage</text>
    <text x="600" y="64" text-anchor="middle" fill="#7a8496" font-size="14">The barriers are independent; the kernel connects them through program order</text>

    <!-- Compact phase overview. -->
    <rect x="85" y="84" width="1030" height="107" rx="16" fill="#ffffff" stroke="#d9dfeb" filter="url(#shadow)"/>
    <text class="section-label" x="112" y="111" fill="#5262c2">PHASE TRACKING</text>
    <text class="body" x="112" y="139">Hardware barrier</text>
    <g class="code" font-size="13" font-weight="750" text-anchor="middle">
      <rect x="250" y="121" width="58" height="27" rx="13.5" fill="#e7f6f7"/><text x="279" y="139" fill="#277e88">phase 0</text>
      <path d="M315 134H339" stroke="#8d98aa" stroke-width="1.7" marker-end="url(#arrow-teal)"/>
      <rect x="348" y="121" width="58" height="27" rx="13.5" fill="#e7f6f7"/><text x="377" y="139" fill="#277e88">phase 1</text>
      <path d="M413 134H437" stroke="#8d98aa" stroke-width="1.7" marker-end="url(#arrow-teal)"/>
      <rect x="446" y="121" width="58" height="27" rx="13.5" fill="#e7f6f7"/><text x="475" y="139" fill="#277e88">phase 2</text>
    </g>
    <text class="small" x="525" y="139">advances automatically when the phase completes</text>

    <text class="body" x="112" y="172">Each thread tracks</text>
    <text class="code" x="250" y="172" fill="#172033" font-size="14" font-weight="750">p: 0 → 1 → 0 → 1</text>
    <text class="code" x="416" y="172" fill="#6476df" font-size="13" font-weight="750">p ^= 1</text>
    <text class="small" x="485" y="172">after its wait returns</text>
    <rect x="840" y="111" width="112" height="52" rx="12" fill="#f2fbfc" stroke="#a8d9dd"/>
    <text class="code" x="896" y="133" text-anchor="middle" fill="#277e88" font-size="12" font-weight="750">tma_barrier</text>
    <text class="small" x="896" y="151" text-anchor="middle">own phase</text>
    <rect x="969" y="111" width="112" height="52" rx="12" fill="#fff7f2" stroke="#efc4b4"/>
    <text class="code" x="1025" y="133" text-anchor="middle" fill="#b74828" font-size="12" font-weight="750">mma_barrier</text>
    <text class="small" x="1025" y="151" text-anchor="middle">own phase</text>

    <!-- TMA handoff. -->
    <rect x="45" y="211" width="1110" height="191" rx="18" fill="#ffffff" stroke="#d9dfeb" filter="url(#shadow)"/>
    <rect x="68" y="229" width="71" height="23" rx="11.5" fill="#ddf2f4"/>
    <text class="section-label" x="103.5" y="245" text-anchor="middle" fill="#277e88">1 · LOAD</text>
    <text class="panel-title" x="153" y="246">TMA fills the shared A/B tiles</text>

    <!-- Global matrices A and B. -->
    <text x="106" y="278" text-anchor="middle" fill="#172033" font-size="15" font-weight="750">A</text>
    <use href="#matrix-grid" x="66" y="287"/>
    <rect x="107" y="323" width="38" height="33" rx="4" fill="#dfe4ff" stroke="#6476df" stroke-width="1.5"/>
    <text x="206" y="278" text-anchor="middle" fill="#172033" font-size="15" font-weight="750">B</text>
    <use href="#matrix-grid" x="166" y="287"/>
    <rect x="167" y="288" width="38" height="33" rx="4" fill="#d4edef" stroke="#31929e" stroke-width="1.5"/>
    <text class="small" x="156" y="380" text-anchor="middle">global memory</text>

    <path d="M255 322H290" fill="none" stroke="#6476df" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
    <rect x="299" y="294" width="102" height="57" rx="14" fill="#edf0ff" stroke="#cbd2f2"/>
    <text x="350" y="318" text-anchor="middle" fill="#4054be" font-size="13" font-weight="750">TMA engine</text>
    <text class="small" x="350" y="338" text-anchor="middle">async copy</text>
    <path d="M401 322H432" fill="none" stroke="#6476df" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>

    <!-- Shared-memory tiles. -->
    <rect x="441" y="279" width="142" height="91" rx="13" fill="#f7f8fb" stroke="#cfd6e5"/>
    <text class="small" x="512" y="296" text-anchor="middle">shared memory</text>
    <rect x="459" y="306" width="47" height="47" rx="6" fill="#dfe4ff" stroke="#6476df" stroke-width="1.5"/>
    <path d="M474.7 306V353M490.3 306V353M459 321.7H506M459 337.3H506" stroke="#b9c2ef"/>
    <text x="482.5" y="335" text-anchor="middle" fill="#4054be" font-size="13" font-weight="750">A</text>
    <rect x="518" y="306" width="47" height="47" rx="6" fill="#d4edef" stroke="#31929e" stroke-width="1.5"/>
    <path d="M533.7 306V353M549.3 306V353M518 321.7H565M518 337.3H565" stroke="#a8d9dd"/>
    <text x="541.5" y="335" text-anchor="middle" fill="#277e88" font-size="13" font-weight="750">B</text>

    <!-- Threads waiting at TMA barrier. -->
    <text class="small" x="679" y="292" text-anchor="middle">CTA threads wait</text>
    <g>
      <use href="#thread" transform="translate(624 307)"/><use href="#thread" transform="translate(655 307)"/>
      <use href="#thread" transform="translate(686 307)"/><use href="#thread" transform="translate(717 307)"/>
      <use href="#thread" transform="translate(624 339)"/><use href="#thread" transform="translate(655 339)"/>
      <use href="#thread" transform="translate(686 339)"/><use href="#thread" transform="translate(717 339)"/>
    </g>
    <path d="M756 333H785" fill="none" stroke="#31929e" stroke-width="2.3" marker-end="url(#arrow-teal)"/>

    <!-- TMA barrier gate. -->
    <rect x="796" y="294" width="44" height="72" rx="10" fill="#f2fbfc" stroke="#a8d9dd"/>
    <path d="M807 306V354M829 306V354M807 331H829" fill="none" stroke="#31929e" stroke-width="4" stroke-linecap="round"/>
    <rect x="791" y="370" width="54" height="20" rx="10" fill="#e7f6f7"/>
    <text class="code" x="818" y="384" text-anchor="middle" fill="#277e88" font-size="10" font-weight="750">phase p</text>

    <path d="M840 333H873" fill="none" stroke="#31929e" stroke-width="2.3" marker-end="url(#arrow-teal)"/>
    <rect x="882" y="286" width="241" height="84" rx="13" fill="#f2fbfc" stroke="#a8d9dd"/>
    <text class="section-label" x="1002.5" y="309" text-anchor="middle" fill="#277e88">PHASE COMPLETES</text>
    <text class="body" x="1002.5" y="333" text-anchor="middle">All expected bytes have arrived</text>
    <text x="1002.5" y="356" text-anchor="middle" fill="#172033" font-size="13" font-weight="750">MMA may read the tiles</text>
    <path d="M548 279C612 251 734 250 802 292" fill="none" stroke="#31929e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow-teal)"/>
    <text class="small" x="678" y="258" text-anchor="middle" fill="#277e88">TMA signals bytes as they arrive</text>
    <rect x="765" y="266" width="106" height="23" rx="11.5" fill="#f2fbfc"/>
    <text class="code" x="818" y="282" text-anchor="middle" fill="#277e88" font-size="12" font-weight="750">tma_barrier</text>

    <!-- MMA handoff. -->
    <rect x="45" y="422" width="1110" height="191" rx="18" fill="#ffffff" stroke="#d9dfeb" filter="url(#shadow)"/>
    <rect x="68" y="440" width="94" height="23" rx="11.5" fill="#fff0e9"/>
    <text class="section-label" x="115" y="456" text-anchor="middle" fill="#b74828">2 · COMPUTE</text>
    <text class="panel-title" x="176" y="457">MMA consumes the tiles before TMA may overwrite them</text>

    <!-- Shared inputs to MMA and TMEM C. -->
    <rect x="72" y="489" width="132" height="82" rx="13" fill="#f7f8fb" stroke="#cfd6e5"/>
    <text class="small" x="138" y="506" text-anchor="middle">shared A/B</text>
    <rect x="90" y="518" width="42" height="39" rx="5" fill="#dfe4ff" stroke="#6476df"/>
    <text x="111" y="543" text-anchor="middle" fill="#4054be" font-size="13" font-weight="750">A</text>
    <rect x="144" y="518" width="42" height="39" rx="5" fill="#d4edef" stroke="#31929e"/>
    <text x="165" y="543" text-anchor="middle" fill="#277e88" font-size="13" font-weight="750">B</text>
    <path d="M204 531H235" fill="none" stroke="#6476df" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
    <rect x="244" y="502" width="103" height="57" rx="14" fill="#edf0ff" stroke="#cbd2f2"/>
    <text x="295.5" y="526" text-anchor="middle" fill="#4054be" font-size="13" font-weight="750">Tensor cores</text>
    <text class="small" x="295.5" y="546" text-anchor="middle">async MMA</text>
    <path d="M347 531H379" fill="none" stroke="#6476df" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>

    <text x="429" y="494" text-anchor="middle" fill="#172033" font-size="14" font-weight="750">C in TMEM</text>
    <use href="#matrix-grid" x="389" y="503"/>
    <rect x="390" y="504" width="78" height="68" rx="6" fill="#fff0e9" fill-opacity="0.7" stroke="#d76543" stroke-width="1.5"/>
    <text x="429" y="543" text-anchor="middle" fill="#b74828" font-size="15" font-weight="750">C += A × B</text>

    <!-- Threads waiting at MMA barrier. -->
    <text class="small" x="629" y="503" text-anchor="middle">CTA threads wait</text>
    <g>
      <use href="#thread" transform="translate(574 518)"/><use href="#thread" transform="translate(605 518)"/>
      <use href="#thread" transform="translate(636 518)"/><use href="#thread" transform="translate(667 518)"/>
      <use href="#thread" transform="translate(574 550)"/><use href="#thread" transform="translate(605 550)"/>
      <use href="#thread" transform="translate(636 550)"/><use href="#thread" transform="translate(667 550)"/>
    </g>
    <path d="M706 544H735" fill="none" stroke="#d76543" stroke-width="2.3" marker-end="url(#arrow-orange)"/>

    <!-- MMA barrier gate. -->
    <rect x="746" y="505" width="44" height="72" rx="10" fill="#fff7f2" stroke="#efc4b4"/>
    <path d="M757 517V565M779 517V565M757 542H779" fill="none" stroke="#d76543" stroke-width="4" stroke-linecap="round"/>
    <rect x="741" y="581" width="54" height="20" rx="10" fill="#fff0e9"/>
    <text class="code" x="768" y="595" text-anchor="middle" fill="#b74828" font-size="10" font-weight="750">phase p</text>

    <path d="M790 544H823" fill="none" stroke="#d76543" stroke-width="2.3" marker-end="url(#arrow-orange)"/>
    <rect x="832" y="497" width="291" height="84" rx="13" fill="#fff7f2" stroke="#efc4b4"/>
    <text class="section-label" x="977.5" y="520" text-anchor="middle" fill="#b74828">PHASE COMPLETES</text>
    <text class="body" x="977.5" y="544" text-anchor="middle">The committed MMA batch has finished</text>
    <text x="977.5" y="567" text-anchor="middle" fill="#172033" font-size="13" font-weight="750">Next TMA may overwrite shared memory</text>
    <path d="M461 503C528 471 668 471 752 503" fill="none" stroke="#d76543" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow-orange)"/>
    <text class="small" x="614" y="475" text-anchor="middle" fill="#b74828">MMA commit signals when tensor-core work finishes</text>
    <rect x="715" y="477" width="106" height="23" rx="11.5" fill="#fff7f2"/>
    <text class="code" x="768" y="493" text-anchor="middle" fill="#b74828" font-size="12" font-weight="750">mma_barrier</text>
  </g>
</svg>

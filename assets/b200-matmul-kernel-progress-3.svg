<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">B200 matmul performance after shared-memory swizzling</title>
  <desc id="desc">A linear chart from zero to 2500 TFLOP per second. The naive kernel reaches 4 TFLOP per second, the tiled TMA and tensor-core kernel reaches 155 TFLOP per second, and the swizzled kernel reaches 285 TFLOP per second. Reference lines mark cuBLAS at 1763 TFLOP per second and the B200 theoretical peak at 2250 TFLOP per second.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#26304f" flood-opacity="0.08"/>
    </filter>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8d98aa"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .axis-label { fill: #667085; font-size: 14px; font-weight: 560; }
      .tick-label { fill: #7a8496; font-size: 13px; font-weight: 520; }
      .reference-label { font-size: 14px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="#fbfcff"/>

  <g class="sans">
    <text x="600" y="46" text-anchor="middle" fill="#172033" font-size="25" font-weight="750">B200 matmul kernel performance</text>
    <text x="600" y="74" text-anchor="middle" fill="#7a8496" font-size="14">Measured throughput on a linear 0–2,500 TFLOP/s scale</text>

    <g filter="url(#shadow)">
      <rect x="76" y="98" width="1066" height="548" rx="18" fill="#ffffff" stroke="#d9dfeb"/>
    </g>

    <!-- Plot grid: 95 px represents 500 TFLOP/s. -->
    <g fill="none" stroke="#e7eaf0" stroke-width="1">
      <path d="M130 125H1100"/><path d="M130 220H1100"/><path d="M130 315H1100"/>
      <path d="M130 410H1100"/><path d="M130 505H1100"/><path d="M130 600H1100"/>
    </g>

    <g class="tick-label" text-anchor="end">
      <text x="116" y="130">2,500</text><text x="116" y="225">2,000</text><text x="116" y="320">1,500</text>
      <text x="116" y="415">1,000</text><text x="116" y="510">500</text><text x="116" y="605">0</text>
    </g>

    <path d="M130 125V600H1100" fill="none" stroke="#8d98aa" stroke-width="1.5"/>
    <text class="axis-label" x="34" y="362" text-anchor="middle" transform="rotate(-90 34 362)">Throughput (TFLOP/s)</text>
    <path d="M220 624H1094" fill="none" stroke="#8d98aa" stroke-width="1.5" marker-end="url(#axis-arrow)"/>
    <text class="axis-label" x="660" y="683" text-anchor="middle">Kernel progression</text>

    <!-- Reference performance. -->
    <path d="M130 172.5H1100" fill="none" stroke="#d48043" stroke-width="2.5" stroke-dasharray="8 7"/>
    <rect x="850" y="137" width="250" height="29" rx="14.5" fill="#fff2e8"/>
    <text class="reference-label" x="1085" y="157" text-anchor="end" fill="#a95722">Theoretical peak · 2,250</text>

    <path d="M130 265.03H1100" fill="none" stroke="#31929e" stroke-width="2.5" stroke-dasharray="8 7"/>
    <rect x="887" y="230" width="213" height="29" rx="14.5" fill="#e7f6f7"/>
    <text class="reference-label" x="1085" y="250" text-anchor="end" fill="#237984">cuBLAS · 1,763</text>

    <!-- Kernel progression: 4 maps to 599.24; 155 to 570.55; 285 to 545.85. -->
    <path d="M260 599.24L570 570.55L880 545.85" fill="none" stroke="#6476df" stroke-width="3"/>

    <path d="M260 576V591" fill="none" stroke="#6476df" stroke-width="2"/>
    <rect x="188" y="520" width="144" height="56" rx="12" fill="#edf0ff" stroke="#cbd2f2"/>
    <text x="260" y="543" text-anchor="middle" fill="#3347ad" font-size="14" font-weight="750">Naive</text>
    <text x="260" y="563" text-anchor="middle" fill="#5363bd" font-size="13" font-weight="650">4 TFLOP/s</text>
    <circle cx="260" cy="599.24" r="7" fill="#6476df" stroke="#ffffff" stroke-width="3"/>

    <path d="M570 532V562" fill="none" stroke="#31929e" stroke-width="2"/>
    <rect x="455" y="470" width="230" height="62" rx="12" fill="#e7f6f7" stroke="#a8d9dd"/>
    <text x="570" y="495" text-anchor="middle" fill="#237984" font-size="14" font-weight="750">TMA + tensor cores</text>
    <text x="570" y="517" text-anchor="middle" fill="#277e88" font-size="13" font-weight="650">155 TFLOP/s</text>
    <circle cx="570" cy="570.55" r="8" fill="#31929e" stroke="#ffffff" stroke-width="3"/>

    <path d="M880 472V537" fill="none" stroke="#7c5cc4" stroke-width="2"/>
    <rect x="792" y="410" width="176" height="62" rx="12" fill="#f2ecfb" stroke="#d1c2eb"/>
    <text x="880" y="435" text-anchor="middle" fill="#6845ad" font-size="14" font-weight="750">Swizzling</text>
    <text x="880" y="457" text-anchor="middle" fill="#7555b5" font-size="13" font-weight="650">285 TFLOP/s</text>
    <circle cx="880" cy="545.85" r="8" fill="#7c5cc4" stroke="#ffffff" stroke-width="3"/>

    <g fill="none" stroke="#8d98aa" stroke-width="1.5">
      <path d="M260 600V608"/><path d="M570 600V608"/><path d="M880 600V608"/>
    </g>
    <g fill="#344054" font-size="13.5" font-weight="700" text-anchor="middle">
      <text x="260" y="643">Naive</text>
      <text x="570" y="643">TMA + tensor cores</text>
      <text x="880" y="643">Swizzling</text>
    </g>
  </g>
</svg>

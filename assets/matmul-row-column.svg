<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">One entry of a matrix product is a row-column dot product</title>
  <desc id="desc">A highlighted row i of matrix A and highlighted column j of matrix B form a dot product whose result is the highlighted entry c sub i j of matrix C.</desc>

  <defs>
    <style>
      .matrix-entry {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 21px;
        font-style: italic;
      }
      .matrix-subscript {
        font-size: 12px;
        baseline-shift: sub;
      }
      .formula-text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 27px;
        font-style: italic;
      }
      .formula-subscript,
      .formula-superscript {
        font-size: 16px;
      }
      .formula-subscript {
        baseline-shift: sub;
      }
      .formula-superscript {
        baseline-shift: super;
      }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#26304f" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5d6fe5"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3b9ca8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d76543"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#fbfcff"/>
  <text x="600" y="48" text-anchor="middle" fill="#172033" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">
    One output entry is one row-column dot product
  </text>

  <!-- Center the matrix expression within the full view box. -->
  <g transform="translate(20 0)">
  <!-- Matrix A -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="205" y="100" text-anchor="middle" fill="#172033" font-family="Georgia, serif" font-size="30" font-style="italic">A</text>
    <rect x="70" y="125" width="270" height="210" rx="12" fill="#ffffff" stroke="#dce2ee" filter="url(#shadow)"/>
    <rect x="76" y="198" width="258" height="64" rx="8" fill="#edf0ff" stroke="#5d6fe5" stroke-width="2"/>
    <path d="M55 125 H43 V335 H55 M355 125 H367 V335 H355" fill="none" stroke="#667085" stroke-width="3" stroke-linecap="round"/>
    <g fill="#667085" text-anchor="middle">
      <text class="matrix-entry" x="108" y="170">a<tspan class="matrix-subscript">11</tspan></text><text class="matrix-entry" x="172" y="170">a<tspan class="matrix-subscript">12</tspan></text><text class="matrix-entry" x="236" y="170">⋯</text><text class="matrix-entry" x="300" y="170">a<tspan class="matrix-subscript">1k</tspan></text>
      <text class="matrix-entry" x="108" y="310">a<tspan class="matrix-subscript">m1</tspan></text><text class="matrix-entry" x="172" y="310">a<tspan class="matrix-subscript">m2</tspan></text><text class="matrix-entry" x="236" y="310">⋯</text><text class="matrix-entry" x="300" y="310">a<tspan class="matrix-subscript">mk</tspan></text>
    </g>
    <g fill="#3548b5" font-weight="650" text-anchor="middle">
      <text class="matrix-entry" x="108" y="238">a<tspan class="matrix-subscript">i1</tspan></text><text class="matrix-entry" x="172" y="238">a<tspan class="matrix-subscript">i2</tspan></text><text class="matrix-entry" x="236" y="238">⋯</text><text class="matrix-entry" x="300" y="238">a<tspan class="matrix-subscript">ik</tspan></text>
    </g>
    <text x="205" y="368" text-anchor="middle" fill="#4059c7" font-size="16" font-weight="700">row i</text>
  </g>

  <text x="407" y="240" text-anchor="middle" fill="#8b95a7" font-family="Georgia, serif" font-size="36">×</text>

  <!-- Matrix B -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="595" y="100" text-anchor="middle" fill="#172033" font-family="Georgia, serif" font-size="30" font-style="italic">B</text>
    <rect x="495" y="110" width="200" height="240" rx="12" fill="#ffffff" stroke="#dce2ee" filter="url(#shadow)"/>
    <rect x="561" y="116" width="68" height="228" rx="8" fill="#e7f6f7" stroke="#3b9ca8" stroke-width="2"/>
    <path d="M480 110 H468 V350 H480 M710 110 H722 V350 H710" fill="none" stroke="#667085" stroke-width="3" stroke-linecap="round"/>
    <g fill="#667085" text-anchor="middle">
      <text class="matrix-entry" x="530" y="158">b<tspan class="matrix-subscript">11</tspan></text><text class="matrix-entry" x="660" y="158">b<tspan class="matrix-subscript">1n</tspan></text>
      <text class="matrix-entry" x="530" y="212">b<tspan class="matrix-subscript">21</tspan></text><text class="matrix-entry" x="660" y="212">b<tspan class="matrix-subscript">2n</tspan></text>
      <text x="530" y="270">⋮</text><text x="660" y="270">⋮</text>
      <text class="matrix-entry" x="530" y="326">b<tspan class="matrix-subscript">k1</tspan></text><text class="matrix-entry" x="660" y="326">b<tspan class="matrix-subscript">kn</tspan></text>
    </g>
    <g fill="#277e88" font-weight="650" text-anchor="middle">
      <text class="matrix-entry" x="595" y="158">b<tspan class="matrix-subscript">1j</tspan></text><text class="matrix-entry" x="595" y="212">b<tspan class="matrix-subscript">2j</tspan></text><text x="595" y="270">⋮</text><text class="matrix-entry" x="595" y="326">b<tspan class="matrix-subscript">kj</tspan></text>
    </g>
    <text x="595" y="383" text-anchor="middle" fill="#277e88" font-size="16" font-weight="700">column j</text>
  </g>

  <text x="782" y="240" text-anchor="middle" fill="#8b95a7" font-family="Georgia, serif" font-size="36">=</text>

  <!-- Matrix C -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="985" y="100" text-anchor="middle" fill="#172033" font-family="Georgia, serif" font-size="30" font-style="italic">C</text>
    <rect x="880" y="125" width="210" height="210" rx="12" fill="#ffffff" stroke="#dce2ee" filter="url(#shadow)"/>
    <rect x="951" y="198" width="68" height="64" rx="8" fill="#fff0e9" stroke="#d76543" stroke-width="2"/>
    <path d="M865 125 H853 V335 H865 M1105 125 H1117 V335 H1105" fill="none" stroke="#667085" stroke-width="3" stroke-linecap="round"/>
    <g fill="#667085" text-anchor="middle">
      <text class="matrix-entry" x="916" y="170">c<tspan class="matrix-subscript">11</tspan></text><text class="matrix-entry" x="985" y="170">c<tspan class="matrix-subscript">1j</tspan></text><text class="matrix-entry" x="1054" y="170">c<tspan class="matrix-subscript">1n</tspan></text>
      <text class="matrix-entry" x="916" y="238">c<tspan class="matrix-subscript">i1</tspan></text><text class="matrix-entry" x="1054" y="238">c<tspan class="matrix-subscript">in</tspan></text>
      <text class="matrix-entry" x="916" y="310">c<tspan class="matrix-subscript">m1</tspan></text><text class="matrix-entry" x="985" y="310">c<tspan class="matrix-subscript">mj</tspan></text><text class="matrix-entry" x="1054" y="310">c<tspan class="matrix-subscript">mn</tspan></text>
    </g>
    <text class="matrix-entry" x="985" y="240" text-anchor="middle" fill="#b74828" font-weight="750">c<tspan class="matrix-subscript">ij</tspan></text>
    <text x="985" y="368" text-anchor="middle" fill="#b74828" font-size="16" font-weight="700">entry (i, j)</text>
  </g>
  </g>

  <!-- Connections to the dot product -->
  <path d="M225 385 C225 430 340 426 420 470" fill="none" stroke="#5d6fe5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M615 400 C615 435 585 445 560 470" fill="none" stroke="#3b9ca8" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M930 470 C975 432 1005 419 1005 389" fill="none" stroke="#d76543" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <g transform="translate(600 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="-330" y="470" width="660" height="70" rx="16" fill="#ffffff" stroke="#dce2ee" filter="url(#shadow)"/>
    <text class="formula-text" x="0" y="505" text-anchor="middle" dominant-baseline="middle" fill="#172033">c<tspan class="formula-subscript">ij</tspan> = [ a<tspan class="formula-subscript">i1</tspan>  a<tspan class="formula-subscript">i2</tspan>  ···  a<tspan class="formula-subscript">ik</tspan> ] · [ b<tspan class="formula-subscript">1j</tspan>  b<tspan class="formula-subscript">2j</tspan>  ···  b<tspan class="formula-subscript">kj</tspan> ]<tspan class="formula-superscript">T</tspan></text>
  </g>
</svg>

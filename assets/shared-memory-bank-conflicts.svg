<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Two reads conflict in one shared-memory bank</title>
  <desc id="desc">Each cell is one 32-bit shared-memory word containing two BF16 values. Thread zero reads word w0 at byte address zero and thread one reads word w32 at byte address 128. Both words map to shared-memory bank zero, producing a bank conflict.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26304f" flood-opacity="0.08"/>
    </filter>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d96652"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bank { fill: #536072; font-size: 13px; font-weight: 720; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#fbfcff"/>

  <g class="sans">
    <text x="600" y="45" text-anchor="middle" fill="#172033" font-size="25" font-weight="760">Shared-memory bank conflict</text>
    <text x="600" y="73" text-anchor="middle" fill="#7a8496" font-size="14">Each cell is one 32-bit word (two BF16 values)</text>

    <!-- The two reads. -->
    <g filter="url(#shadow)">
      <rect x="245" y="103" width="230" height="72" rx="16" fill="#ffffff" stroke="#d9dfeb"/>
      <rect x="725" y="103" width="230" height="72" rx="16" fill="#ffffff" stroke="#d9dfeb"/>
    </g>
    <circle cx="282" cy="139" r="19" fill="#6476df"/>
    <circle cx="762" cy="139" r="19" fill="#6476df"/>
    <text x="282" y="144" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="760">T0</text>
    <text x="762" y="144" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="760">T1</text>
    <text x="318" y="135" fill="#344054" font-size="13" font-weight="720">read word w0</text>
    <text x="318" y="154" fill="#667085" font-size="12">bytes 0–3</text>
    <text x="798" y="135" fill="#344054" font-size="13" font-weight="720">read word w32</text>
    <text x="798" y="154" fill="#667085" font-size="12">bytes 128–131</text>

    <!-- Representative shared-memory banks. -->
    <g filter="url(#shadow)">
      <rect x="155" y="240" width="890" height="225" rx="18" fill="#ffffff" stroke="#d9dfeb"/>
    </g>

    <rect x="185" y="263" width="830" height="62" rx="11" fill="#fff0ed" stroke="#e78e7d"/>
    <text class="bank" x="212" y="299">Bank 0</text>
    <rect x="340" y="273" width="145" height="42" rx="9" fill="#fee1dc" stroke="#e78e7d"/>
    <rect x="505" y="273" width="145" height="42" rx="9" fill="#fee1dc" stroke="#e78e7d"/>
    <rect x="670" y="273" width="145" height="42" rx="9" fill="#e7eaf1"/>
    <rect x="835" y="273" width="145" height="42" rx="9" fill="#e7eaf1"/>
    <text x="412.5" y="290" text-anchor="middle" fill="#a53f2f" font-size="11" font-weight="720">T0</text>
    <text x="412.5" y="307" text-anchor="middle" fill="#a53f2f" font-size="13" font-weight="760">w0</text>
    <text x="577.5" y="290" text-anchor="middle" fill="#a53f2f" font-size="11" font-weight="720">T1</text>
    <text x="577.5" y="307" text-anchor="middle" fill="#a53f2f" font-size="13" font-weight="760">w32</text>
    <text x="742.5" y="299" text-anchor="middle" fill="#7a8496" font-size="12" font-weight="700">w64</text>
    <text x="907.5" y="299" text-anchor="middle" fill="#7a8496" font-size="12" font-weight="700">w96</text>
    <path d="M360 181C360 216 388 236 413 265" fill="none" stroke="#d96652" stroke-width="3" marker-end="url(#red-arrow)"/>
    <path d="M840 181C840 215 674 235 578 265" fill="none" stroke="#d96652" stroke-width="3" marker-end="url(#red-arrow)"/>

    <rect x="185" y="337" width="830" height="38" rx="9" fill="#f5f7fb" stroke="#e0e4ec"/>
    <rect x="185" y="385" width="830" height="26" rx="9" fill="#fafbfc" stroke="#e0e4ec" stroke-dasharray="4 4"/>
    <rect x="185" y="421" width="830" height="38" rx="9" fill="#f5f7fb" stroke="#e0e4ec"/>
    <text class="bank" x="212" y="361">Bank 1</text>
    <text class="bank" x="221" y="403">⋮</text>
    <text class="bank" x="212" y="445">Bank 31</text>
    <g fill="#e7eaf1">
      <rect x="340" y="343" width="145" height="26" rx="7"/>
      <rect x="505" y="343" width="145" height="26" rx="7"/>
      <rect x="670" y="343" width="145" height="26" rx="7"/>
      <rect x="835" y="343" width="145" height="26" rx="7"/>
      <rect x="340" y="427" width="145" height="26" rx="7"/>
      <rect x="505" y="427" width="145" height="26" rx="7"/>
      <rect x="670" y="427" width="145" height="26" rx="7"/>
      <rect x="835" y="427" width="145" height="26" rx="7"/>
    </g>
    <g fill="#7a8496" font-size="11" font-weight="680" text-anchor="middle">
      <text x="412.5" y="360">w1</text><text x="577.5" y="360">w33</text><text x="742.5" y="360">w65</text><text x="907.5" y="360">w97</text>
      <text x="412.5" y="444">w31</text><text x="577.5" y="444">w63</text><text x="742.5" y="444">w95</text><text x="907.5" y="444">w127</text>
    </g>

    <rect x="377" y="490" width="446" height="45" rx="12" fill="#fee1dc"/>
    <text x="600" y="518" text-anchor="middle" fill="#a53f2f" font-size="15" font-weight="780">Same bank → conflicting reads</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Sequential programming compared with GPU thread-based programming</title>
  <desc id="desc">On the left, one worker computes the sixteen elements of an output tile in sequence. On the right, a grid of sixteen logical GPU threads maps one-to-one onto the sixteen output elements so that many elements can be processed concurrently.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#26304f" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6476df"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#31929e"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .panel-title { fill: #172033; font-size: 21px; font-weight: 750; }
      .label { fill: #344054; font-size: 14px; font-weight: 680; }
      .sub-label { fill: #667085; font-size: 13px; font-weight: 520; }
      .cell-label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="24" fill="#fbfcff"/>

  <g class="sans">
    <text x="600" y="43" text-anchor="middle" fill="#172033" font-size="25" font-weight="750">From a sequential loop to a grid of threads</text>
    <text x="600" y="70" text-anchor="middle" fill="#7a8496" font-size="14">The same 4 × 4 output tile, expressed with two different programming models</text>

    <!-- Panels -->
    <g filter="url(#shadow)">
      <rect x="48" y="98" width="512" height="514" rx="20" fill="#ffffff" stroke="#d9dfeb"/>
      <rect x="640" y="98" width="512" height="514" rx="20" fill="#ffffff" stroke="#d9dfeb"/>
    </g>
    <path d="M600 118V590" stroke="#d6dce8" stroke-width="2" stroke-dasharray="5 8"/>

    <!-- Sequential side -->
    <circle cx="80" cy="128" r="8" fill="#6476df"/>
    <text class="panel-title" x="100" y="136">Traditional sequential loop</text>
    <rect x="430" y="116" width="102" height="27" rx="13.5" fill="#edf0ff"/>
    <text x="481" y="134" text-anchor="middle" fill="#4f61c7" font-size="11" font-weight="750" letter-spacing="0.7">ONE WORKER</text>

    <rect x="83" y="160" width="442" height="78" rx="12" fill="#f7f8fb" stroke="#dce1ea"/>
    <text class="mono" x="105" y="190" fill="#445065" font-size="14">for i, j in output_coordinates:</text>
    <text class="mono" x="129" y="216" fill="#4059c7" font-size="14">C[i, j] = dot(A[i, :], B[:, j])</text>

    <path d="M304 250V273" fill="none" stroke="#6476df" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
    <text class="sub-label" x="304" y="270" text-anchor="middle">visit each output in order</text>

    <!-- Sequential output tile -->
    <g transform="translate(164 288)">
      <rect width="280" height="224" rx="12" fill="#fafbfe" stroke="#cfd6e5"/>
      <g stroke="#d7dce7">
        <path d="M70 0V224M140 0V224M210 0V224M0 56H280M0 112H280M0 168H280"/>
      </g>
      <rect x="3" y="3" width="64" height="50" rx="7" fill="#e5e9ff" stroke="#6476df" stroke-width="2"/>
      <rect x="73" y="3" width="64" height="50" rx="7" fill="#f0f2ff"/>
      <g fill="#53627a" text-anchor="middle" class="cell-label">
        <text x="35" y="34" fill="#4054be">1</text><text x="105" y="34">2</text><text x="175" y="34">3</text><text x="245" y="34">4</text>
        <text x="35" y="90">5</text><text x="105" y="90">6</text><text x="175" y="90">7</text><text x="245" y="90">8</text>
        <text x="35" y="146">9</text><text x="105" y="146">10</text><text x="175" y="146">11</text><text x="245" y="146">12</text>
        <text x="35" y="202">13</text><text x="105" y="202">14</text><text x="175" y="202">15</text><text x="245" y="202">16</text>
      </g>
    </g>
    <text class="label" x="304" y="541" text-anchor="middle">One output after another</text>
    <g transform="translate(94 564)">
      <text class="sub-label" x="0" y="15">time</text>
      <path d="M38 10H430" stroke="#9aa5b7" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
      <g fill="#dfe4ff" stroke="#aeb9ee">
        <rect x="50" y="0" width="20" height="20" rx="4"/><rect x="73" y="0" width="20" height="20" rx="4"/>
        <rect x="96" y="0" width="20" height="20" rx="4"/><rect x="119" y="0" width="20" height="20" rx="4"/>
        <rect x="142" y="0" width="20" height="20" rx="4"/><rect x="165" y="0" width="20" height="20" rx="4"/>
        <rect x="188" y="0" width="20" height="20" rx="4"/><rect x="211" y="0" width="20" height="20" rx="4"/>
        <rect x="234" y="0" width="20" height="20" rx="4"/><rect x="257" y="0" width="20" height="20" rx="4"/>
        <rect x="280" y="0" width="20" height="20" rx="4"/><rect x="303" y="0" width="20" height="20" rx="4"/>
        <rect x="326" y="0" width="20" height="20" rx="4"/><rect x="349" y="0" width="20" height="20" rx="4"/>
        <rect x="372" y="0" width="20" height="20" rx="4"/><rect x="395" y="0" width="20" height="20" rx="4"/>
      </g>
    </g>

    <!-- GPU side -->
    <circle cx="672" cy="128" r="8" fill="#31929e"/>
    <text class="panel-title" x="692" y="136">GPU thread-based program</text>
    <rect x="1020" y="116" width="104" height="27" rx="13.5" fill="#e7f6f7"/>
    <text x="1072" y="134" text-anchor="middle" fill="#237984" font-size="11" font-weight="750" letter-spacing="0.7">MANY THREADS</text>

    <rect x="675" y="160" width="442" height="78" rx="12" fill="#f3fafb" stroke="#c9e1e4"/>
    <text class="mono" x="697" y="190" fill="#445065" font-size="14">i, j = this_thread.output_coordinate</text>
    <text class="mono" x="697" y="216" fill="#277e88" font-size="14">C[i, j] = dot(A[i, :], B[:, j])</text>

    <text class="sub-label" x="755" y="273" text-anchor="middle">logical thread grid</text>
    <text class="sub-label" x="1007" y="273" text-anchor="middle">output tile C</text>

    <!-- Logical threads -->
    <g transform="translate(687 288)" class="cell-label" text-anchor="middle">
      <g fill="#e7f6f7" stroke="#79bac1">
        <rect x="0" y="0" width="34" height="34" rx="8"/><rect x="42" y="0" width="34" height="34" rx="8"/><rect x="84" y="0" width="34" height="34" rx="8"/><rect x="126" y="0" width="34" height="34" rx="8"/>
        <rect x="0" y="42" width="34" height="34" rx="8"/><rect x="42" y="42" width="34" height="34" rx="8"/><rect x="84" y="42" width="34" height="34" rx="8"/><rect x="126" y="42" width="34" height="34" rx="8"/>
        <rect x="0" y="84" width="34" height="34" rx="8"/><rect x="42" y="84" width="34" height="34" rx="8"/><rect x="84" y="84" width="34" height="34" rx="8"/><rect x="126" y="84" width="34" height="34" rx="8"/>
        <rect x="0" y="126" width="34" height="34" rx="8"/><rect x="42" y="126" width="34" height="34" rx="8"/><rect x="84" y="126" width="34" height="34" rx="8"/><rect x="126" y="126" width="34" height="34" rx="8"/>
      </g>
      <g fill="#277e88">
        <text x="17" y="22">T<tspan font-size="8">00</tspan></text><text x="59" y="22">T<tspan font-size="8">01</tspan></text><text x="101" y="22">T<tspan font-size="8">02</tspan></text><text x="143" y="22">T<tspan font-size="8">03</tspan></text>
        <text x="17" y="64">T<tspan font-size="8">10</tspan></text><text x="59" y="64">T<tspan font-size="8">11</tspan></text><text x="101" y="64">T<tspan font-size="8">12</tspan></text><text x="143" y="64">T<tspan font-size="8">13</tspan></text>
        <text x="17" y="106">T<tspan font-size="8">20</tspan></text><text x="59" y="106">T<tspan font-size="8">21</tspan></text><text x="101" y="106">T<tspan font-size="8">22</tspan></text><text x="143" y="106">T<tspan font-size="8">23</tspan></text>
        <text x="17" y="148">T<tspan font-size="8">30</tspan></text><text x="59" y="148">T<tspan font-size="8">31</tspan></text><text x="101" y="148">T<tspan font-size="8">32</tspan></text><text x="143" y="148">T<tspan font-size="8">33</tspan></text>
      </g>
    </g>

    <path d="M866 368H898" fill="none" stroke="#31929e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
    <text x="882" y="354" text-anchor="middle" fill="#277e88" font-size="11" font-weight="700">1:1</text>

    <!-- Concurrent output tile -->
    <g transform="translate(912 288)">
      <rect width="190" height="160" rx="12" fill="#eff9fa" stroke="#79bac1" stroke-width="1.5"/>
      <g stroke="#9ecdd2">
        <path d="M47.5 0V160M95 0V160M142.5 0V160M0 40H190M0 80H190M0 120H190"/>
      </g>
      <g fill="#277e88" text-anchor="middle" class="cell-label">
        <text x="24" y="25">C<tspan font-size="8">00</tspan></text><text x="71" y="25">C<tspan font-size="8">01</tspan></text><text x="119" y="25">C<tspan font-size="8">02</tspan></text><text x="166" y="25">C<tspan font-size="8">03</tspan></text>
        <text x="24" y="65">C<tspan font-size="8">10</tspan></text><text x="71" y="65">C<tspan font-size="8">11</tspan></text><text x="119" y="65">C<tspan font-size="8">12</tspan></text><text x="166" y="65">C<tspan font-size="8">13</tspan></text>
        <text x="24" y="105">C<tspan font-size="8">20</tspan></text><text x="71" y="105">C<tspan font-size="8">21</tspan></text><text x="119" y="105">C<tspan font-size="8">22</tspan></text><text x="166" y="105">C<tspan font-size="8">23</tspan></text>
        <text x="24" y="145">C<tspan font-size="8">30</tspan></text><text x="71" y="145">C<tspan font-size="8">31</tspan></text><text x="119" y="145">C<tspan font-size="8">32</tspan></text><text x="166" y="145">C<tspan font-size="8">33</tspan></text>
      </g>
    </g>

    <text class="label" x="896" y="481" text-anchor="middle">Many outputs in flight concurrently</text>
    <text class="sub-label" x="896" y="503" text-anchor="middle">hardware schedules threads in warps</text>

    <g transform="translate(686 564)">
      <text class="sub-label" x="0" y="15">time</text>
      <path d="M38 10H415" stroke="#9aa5b7" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
      <rect x="50" y="0" width="340" height="20" rx="6" fill="#dff3f5" stroke="#79bac1"/>
      <g fill="#31929e">
        <circle cx="67" cy="10" r="4"/><circle cx="88" cy="10" r="4"/><circle cx="109" cy="10" r="4"/><circle cx="130" cy="10" r="4"/>
        <circle cx="151" cy="10" r="4"/><circle cx="172" cy="10" r="4"/><circle cx="193" cy="10" r="4"/><circle cx="214" cy="10" r="4"/>
        <circle cx="235" cy="10" r="4"/><circle cx="256" cy="10" r="4"/><circle cx="277" cy="10" r="4"/><circle cx="298" cy="10" r="4"/>
        <circle cx="319" cy="10" r="4"/><circle cx="340" cy="10" r="4"/><circle cx="361" cy="10" r="4"/><circle cx="382" cy="10" r="4"/>
      </g>
    </g>
  </g>
</svg>

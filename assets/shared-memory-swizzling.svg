<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">How shared-memory swizzling redistributes values across banks</title>
  <desc id="desc">Each cell is one 32-bit shared-memory word containing two BF16 values. A logical tile has four highlighted words in one word column. The K SW128 layout applies an XOR-style address permutation so the words occupy four different shared-memory banks. TMA writes and MMA reads the same swizzled layout.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26304f" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6476df"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #344054; font-size: 13px; font-weight: 740; }
      .value { font-size: 12px; font-weight: 760; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#fbfcff"/>

  <g class="sans">
    <text x="600" y="43" text-anchor="middle" fill="#172033" font-size="25" font-weight="760">Swizzling changes physical placement</text>
    <text x="600" y="70" text-anchor="middle" fill="#7a8496" font-size="14">Each cell is one 32-bit word (two BF16 values); logical coordinates stay the same</text>

    <g filter="url(#shadow)">
      <rect x="50" y="96" width="1100" height="454" rx="18" fill="#ffffff" stroke="#d9dfeb"/>
    </g>

    <!-- Logical tile. -->
    <text x="275" y="132" text-anchor="middle" fill="#172033" font-size="17" font-weight="760">Before swizzling</text>
    <g fill="#f3f5f9" stroke="#d9dfeb">
      <rect x="91" y="154" width="82" height="62" rx="8"/><rect x="181" y="154" width="82" height="62" rx="8"/><rect x="271" y="154" width="82" height="62" rx="8"/><rect x="361" y="154" width="82" height="62" rx="8"/>
      <rect x="91" y="224" width="82" height="62" rx="8"/><rect x="181" y="224" width="82" height="62" rx="8"/><rect x="271" y="224" width="82" height="62" rx="8"/><rect x="361" y="224" width="82" height="62" rx="8"/>
      <rect x="91" y="294" width="82" height="62" rx="8"/><rect x="181" y="294" width="82" height="62" rx="8"/><rect x="271" y="294" width="82" height="62" rx="8"/><rect x="361" y="294" width="82" height="62" rx="8"/>
      <rect x="91" y="364" width="82" height="62" rx="8"/><rect x="181" y="364" width="82" height="62" rx="8"/><rect x="271" y="364" width="82" height="62" rx="8"/><rect x="361" y="364" width="82" height="62" rx="8"/>
    </g>
    <g fill="#7a8496" font-size="12" font-weight="650" text-anchor="middle">
      <text x="222" y="190">w1</text><text x="312" y="190">w2</text><text x="402" y="190">w3</text>
      <text x="222" y="260">w33</text><text x="312" y="260">w34</text><text x="402" y="260">w35</text>
      <text x="222" y="330">w65</text><text x="312" y="330">w66</text><text x="402" y="330">w67</text>
      <text x="222" y="400">w97</text><text x="312" y="400">w98</text><text x="402" y="400">w99</text>
    </g>
    <rect x="91" y="154" width="82" height="62" rx="8" fill="#e1e6ff" stroke="#8290e8"/>
    <rect x="91" y="224" width="82" height="62" rx="8" fill="#daf2eb" stroke="#83c9b7"/>
    <rect x="91" y="294" width="82" height="62" rx="8" fill="#fff0dc" stroke="#e9bd76"/>
    <rect x="91" y="364" width="82" height="62" rx="8" fill="#f5e3f1" stroke="#d6a0c8"/>
    <g class="value" text-anchor="middle">
      <text x="132" y="190" fill="#4656af">w0</text>
      <text x="132" y="260" fill="#24765f">w32</text>
      <text x="132" y="330" fill="#a66b14">w64</text>
      <text x="132" y="400" fill="#96547f">w96</text>
    </g>
    <path d="M74 147V433" fill="none" stroke="#6476df" stroke-width="2"/>
    <path d="M68 147H80M68 433H80" fill="none" stroke="#6476df" stroke-width="2"/>
    <text x="61" y="290" text-anchor="middle" transform="rotate(-90 61 290)" fill="#4656af" font-size="11" font-weight="720">simultaneously accessed</text>
    <g>
      <rect x="91" y="448" width="82" height="42" rx="8" fill="#f3f5f9" stroke="#d9dfeb"/>
      <rect x="181" y="448" width="82" height="42" rx="8" fill="#f3f5f9" stroke="#d9dfeb"/>
      <rect x="271" y="448" width="82" height="42" rx="8" fill="#f3f5f9" stroke="#d9dfeb"/>
      <rect x="361" y="448" width="82" height="42" rx="8" fill="#f3f5f9" stroke="#d9dfeb"/>
      <g fill="#536072" font-size="10.5" font-weight="720" text-anchor="middle">
        <text x="132" y="465">word col. 0</text><text x="132" y="481">→ Bank 0</text>
        <text x="222" y="465">word col. 1</text><text x="222" y="481">→ Bank 1</text>
        <text x="312" y="465">word col. 2</text><text x="312" y="481">→ Bank 2</text>
        <text x="402" y="465">word col. 3</text><text x="402" y="481">→ Bank 3</text>
      </g>
    </g>

    <!-- Mapping. -->
    <path d="M470 290H638" fill="none" stroke="#6476df" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="490" y="230" width="128" height="46" rx="23" fill="#edf0ff" stroke="#cbd2f2"/>
    <text x="554" y="250" text-anchor="middle" fill="#3347ad" font-size="12" font-weight="760">K_SW128</text>
    <text x="554" y="266" text-anchor="middle" fill="#5363bd" font-size="10.5">XOR permutation</text>

    <!-- Physical bank columns. -->
    <text x="880" y="132" text-anchor="middle" fill="#172033" font-size="17" font-weight="760">Physical shared memory</text>
    <g fill="#f5f7fb" stroke="#d9dfeb">
      <rect x="660" y="154" width="105" height="290" rx="9"/>
      <rect x="775" y="154" width="105" height="290" rx="9"/>
      <rect x="890" y="154" width="105" height="290" rx="9"/>
      <rect x="1005" y="154" width="105" height="290" rx="9"/>
    </g>
    <g class="label" text-anchor="middle">
      <text x="712.5" y="180">Bank 0</text><text x="827.5" y="180">Bank 1</text><text x="942.5" y="180">Bank 2</text><text x="1057.5" y="180">Bank 3</text>
    </g>
    <g fill="#e7eaf1">
      <rect x="674" y="198" width="77" height="40" rx="7"/><rect x="674" y="252" width="77" height="40" rx="7"/><rect x="674" y="306" width="77" height="40" rx="7"/><rect x="674" y="360" width="77" height="40" rx="7"/>
      <rect x="789" y="198" width="77" height="40" rx="7"/><rect x="789" y="252" width="77" height="40" rx="7"/><rect x="789" y="306" width="77" height="40" rx="7"/><rect x="789" y="360" width="77" height="40" rx="7"/>
      <rect x="904" y="198" width="77" height="40" rx="7"/><rect x="904" y="252" width="77" height="40" rx="7"/><rect x="904" y="306" width="77" height="40" rx="7"/><rect x="904" y="360" width="77" height="40" rx="7"/>
      <rect x="1019" y="198" width="77" height="40" rx="7"/><rect x="1019" y="252" width="77" height="40" rx="7"/><rect x="1019" y="306" width="77" height="40" rx="7"/><rect x="1019" y="360" width="77" height="40" rx="7"/>
    </g>
    <rect x="674" y="198" width="77" height="40" rx="7" fill="#e1e6ff" stroke="#8290e8"/>
    <rect x="789" y="252" width="77" height="40" rx="7" fill="#daf2eb" stroke="#83c9b7"/>
    <rect x="904" y="306" width="77" height="40" rx="7" fill="#fff0dc" stroke="#e9bd76"/>
    <rect x="1019" y="360" width="77" height="40" rx="7" fill="#f5e3f1" stroke="#d6a0c8"/>
    <g class="value" text-anchor="middle">
      <text x="712.5" y="223" fill="#4656af">w0</text>
      <text x="827.5" y="277" fill="#24765f">w32</text>
      <text x="942.5" y="331" fill="#a66b14">w64</text>
      <text x="1057.5" y="385" fill="#96547f">w96</text>
    </g>
    <rect x="764" y="456" width="258" height="38" rx="10" fill="#daf2eb"/>
    <text x="893" y="481" text-anchor="middle" fill="#24765f" font-size="13.5" font-weight="760">different banks → parallel</text>

    <!-- Kernel data path. -->
    <path d="M215 599H985" fill="none" stroke="#6476df" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="150" y="576" width="160" height="46" rx="10" fill="#f3f5fb" stroke="#d9dfeb"/>
    <text x="230" y="604" text-anchor="middle" fill="#344054" font-size="13" font-weight="740">TMA writes</text>
    <rect x="467" y="566" width="266" height="66" rx="12" fill="#edf0ff" stroke="#cbd2f2"/>
    <text x="600" y="594" text-anchor="middle" fill="#3347ad" font-size="13" font-weight="760">swizzled sA / sB</text>
    <text x="600" y="614" text-anchor="middle" fill="#5363bd" font-size="11">one shared layout</text>
    <rect x="890" y="576" width="160" height="46" rx="10" fill="#f3f5fb" stroke="#d9dfeb"/>
    <text x="970" y="604" text-anchor="middle" fill="#344054" font-size="13" font-weight="740">MMA reads</text>
  </g>
</svg>
